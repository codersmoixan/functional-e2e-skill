<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Functional QA review</title>
<style>
/* Functional review Neutral tokens + Geist fallbacks (see references/review.md) */
:root {
  --radius: 0.625rem;
  --background: oklch(1 0 0);
  --foreground: oklch(0.145 0 0);
  --card: oklch(1 0 0);
  --card-foreground: oklch(0.145 0 0);
  --popover: oklch(1 0 0);
  --popover-foreground: oklch(0.145 0 0);
  --primary: oklch(0.205 0 0);
  --primary-foreground: oklch(0.985 0 0);
  --secondary: oklch(0.97 0 0);
  --secondary-foreground: oklch(0.205 0 0);
  --muted: oklch(0.97 0 0);
  --muted-foreground: oklch(0.556 0 0);
  --accent: oklch(0.97 0 0);
  --accent-foreground: oklch(0.205 0 0);
  --destructive: oklch(0.577 0.245 27.325);
  --border: oklch(0.922 0 0);
  --input: oklch(0.922 0 0);
  --ring: oklch(0.708 0 0);
  color-scheme: light;
  --amber-fg: oklch(55.5% 0.163 48.998);
  --emerald-fg: oklch(50.8% 0.118 165.612);
  --amber: oklch(76.9% 0.188 70.08);
  --emerald: oklch(69.6% 0.17 162.48);
  --destructive-bg: var(--destructive);
  --font-sans: Geist, "Geist Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --radius-xs: 0.125rem;
  --radius-sm: calc(var(--radius) - 4px);
  --radius-md: calc(var(--radius) - 2px);
  --radius-lg: var(--radius);
  --radius-xl: calc(var(--radius) + 4px);
  --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  --ring-shadow: 0 0 0 3px color-mix(in oklab, var(--ring) 50%, transparent);
  --field-bg: transparent;
  --outline-bg: var(--background);
  --outline-border: var(--border);
  --outline-hover: var(--accent);
  --bar-h: 3.5rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --background: oklch(0.145 0 0);
    --foreground: oklch(0.985 0 0);
    --card: oklch(0.205 0 0);
    --card-foreground: oklch(0.985 0 0);
    --popover: oklch(0.205 0 0);
    --popover-foreground: oklch(0.985 0 0);
    --primary: oklch(0.922 0 0);
    --primary-foreground: oklch(0.205 0 0);
    --secondary: oklch(0.269 0 0);
    --secondary-foreground: oklch(0.985 0 0);
    --muted: oklch(0.269 0 0);
    --muted-foreground: oklch(0.708 0 0);
    --accent: oklch(0.269 0 0);
    --accent-foreground: oklch(0.985 0 0);
    --destructive: oklch(0.704 0.191 22.216);
    --border: oklch(1 0 0 / 10%);
    --input: oklch(1 0 0 / 15%);
    --ring: oklch(0.556 0 0);
    color-scheme: dark;
    --amber-fg: oklch(82.8% 0.189 84.429);
    --emerald-fg: oklch(76.5% 0.177 163.223);
    --destructive-bg: color-mix(in oklab, var(--destructive) 60%, transparent);
    --field-bg: color-mix(in oklab, var(--input) 30%, transparent);
    --outline-bg: color-mix(in oklab, var(--input) 30%, transparent);
    --outline-border: var(--input);
    --outline-hover: color-mix(in oklab, var(--input) 50%, transparent);
  }
}
*, ::before, ::after { box-sizing: border-box; border: 0 solid var(--border); margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; font-family: var(--font-sans); line-height: 1.5; -webkit-font-smoothing: antialiased; }
body { background: var(--background); color: var(--foreground); font-family: var(--font-sans); font-size: 1rem; line-height: 1.5; min-height: 100vh; }
body.has-bar { padding-bottom: calc(var(--bar-h, 3.5rem) + 3rem); }
h1 { font-size: 1.125rem; line-height: 1.75rem; font-weight: 600; letter-spacing: -0.025em; }
a { color: inherit; text-decoration: underline; text-decoration-color: color-mix(in oklab, currentColor 30%, transparent); text-underline-offset: 3px; }
a:hover { text-decoration-color: currentColor; }
button, input, select, textarea { font: inherit; color: inherit; background: transparent; }
button { cursor: pointer; }
ul { list-style: none; }
code { font-family: var(--font-mono); font-size: 0.8125rem; background: color-mix(in oklab, var(--muted) 80%, transparent); padding: 0.125rem 0.375rem; border-radius: var(--radius-sm); }
:focus-visible { outline: none; box-shadow: var(--ring-shadow); }
.muted { color: var(--muted-foreground); }
.text-sm { font-size: 0.875rem; line-height: 1.25rem; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
.container { max-width: 56rem; margin: 0 auto; padding-inline: 1rem; }
@media (min-width: 768px) { .container { padding-inline: 1.5rem; } }
.stack { display: flex; flex-direction: column; gap: 1rem; }
@media (min-width: 768px) { .stack { gap: 1.25rem; } }
.sep { flex-shrink: 0; background: var(--border); height: 1px; width: 100%; }

.btn { display: inline-flex; flex-shrink: 0; align-items: center; justify-content: center; gap: 0.5rem; border-radius: var(--radius-md); font-size: 0.875rem; line-height: 1.25rem; font-weight: 500; white-space: nowrap; transition: color .15s, background-color .15s, border-color .15s, box-shadow .15s; outline: none; height: 2.25rem; padding: 0.5rem 1rem; }
.btn:focus-visible { border-color: var(--ring); box-shadow: var(--ring-shadow); }
.btn:disabled { pointer-events: none; opacity: 0.5; }
.btn-default { background: var(--primary); color: var(--primary-foreground); }
.btn-default:hover:not(:disabled) { background: color-mix(in oklab, var(--primary) 90%, transparent); }
.btn-outline { border-width: 1px; border-color: var(--outline-border); background: var(--outline-bg); box-shadow: var(--shadow-xs); }
.btn-outline:hover:not(:disabled) { background: var(--outline-hover); color: var(--accent-foreground); }
.btn-ghost { height: 2rem; width: 2rem; padding: 0; border-radius: var(--radius-md); color: var(--muted-foreground); }
.btn-ghost:hover { background: var(--accent); color: var(--foreground); }

.badge { display: inline-flex; width: fit-content; flex-shrink: 0; align-items: center; justify-content: center; gap: 0.25rem; overflow: hidden; border-radius: 9999px; border: 1px solid transparent; padding: 0.125rem 0.5rem; font-size: 0.75rem; line-height: 1rem; font-weight: 500; white-space: nowrap; font-variant-numeric: tabular-nums; }
.badge-secondary { background: var(--secondary); color: var(--secondary-foreground); }
.badge-outline { border-color: var(--border); color: var(--foreground); }
.badge-destructive { background: var(--destructive-bg); color: #fff; }
.badge-amber { background: color-mix(in oklab, var(--amber) 10%, transparent); color: var(--amber-fg); border-color: color-mix(in oklab, var(--amber) 20%, transparent); }
.badge-emerald { background: color-mix(in oklab, var(--emerald) 10%, transparent); color: var(--emerald-fg); border-color: color-mix(in oklab, var(--emerald) 20%, transparent); }

.card { display: flex; flex-direction: column; gap: 1rem; border-radius: var(--radius-xl); border: 1px solid var(--border); background: var(--card); color: var(--card-foreground); padding-block: 1.25rem; box-shadow: var(--shadow-sm); min-width: 0; }
.card-header { display: flex; flex-direction: column; gap: 0.5rem; padding-inline: 1.25rem; }
.card-header .row { gap: 0.375rem; }
.card-title { line-height: 1.25; font-weight: 600; font-size: 1rem; overflow-wrap: anywhere; }
.card-description { font-size: 0.875rem; line-height: 1.25rem; color: var(--muted-foreground); }
.card-content { padding-inline: 1.25rem; display: flex; flex-direction: column; gap: 0.5rem; min-width: 0; }
.kv { font-size: 0.875rem; line-height: 1.375rem; color: var(--muted-foreground); overflow-wrap: anywhere; }
.kv b { color: var(--foreground); font-weight: 500; }
.hints { font-size: 0.875rem; line-height: 1.375rem; color: var(--muted-foreground); overflow-wrap: anywhere; }
.shots { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.25rem; }
.shots img { max-width: 280px; max-height: 180px; object-fit: contain; border: 1px solid var(--border); border-radius: var(--radius-md); cursor: zoom-in; background: var(--muted); }
.actions { display: grid; gap: 0.75rem; margin-top: 0.25rem; }
.actions .row { align-items: flex-end; gap: 1rem; }

.label { display: flex; flex-direction: column; gap: 0.375rem; font-size: 0.875rem; line-height: 1; font-weight: 500; user-select: none; min-width: 0; flex: 1 1 10rem; }
.input, .textarea, .native-select { width: 100%; min-width: 0; border-radius: var(--radius-md); border: 1px solid var(--input); background: var(--field-bg); box-shadow: var(--shadow-xs); outline: none; transition: color .15s, box-shadow .15s; }
.textarea { display: flex; min-height: 4rem; padding: 0.5rem 0.75rem; font-size: 0.875rem; line-height: 1.25rem; field-sizing: content; resize: vertical; }
.textarea::placeholder { color: var(--muted-foreground); }
.textarea:focus-visible, .native-select:focus-visible { border-color: var(--ring); box-shadow: var(--ring-shadow); }
.native-select-wrap { position: relative; width: 100%; }
.native-select { appearance: none; height: 2.25rem; padding: 0.5rem 2.25rem 0.5rem 0.75rem; font-size: 0.875rem; line-height: 1.25rem; cursor: pointer; }
.native-select:hover { background: var(--outline-hover); }
.native-select-wrap > svg { position: absolute; top: 50%; right: 0.875rem; width: 1rem; height: 1rem; transform: translateY(-50%); color: var(--muted-foreground); opacity: 0.5; pointer-events: none; }

.site-header { position: sticky; top: 0; z-index: 20; border-bottom: 1px solid var(--border); background: color-mix(in oklab, var(--background) 92%, transparent); backdrop-filter: blur(8px); }
.hero-bar { padding-block: 0.75rem; display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1rem; }
.hero-bar .end { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem; }
.page-main { padding-block: 1.25rem; }

/* Bottom review bar — floating centred handoff (see references/review.md) */
.bar-stack {
  position: fixed; z-index: 40; left: 50%; bottom: 1rem; transform: translateX(-50%);
  width: max-content; max-width: calc(100vw - 2rem);
  display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
  pointer-events: none;
}
.review-bar {
  pointer-events: auto; width: max-content; max-width: 100%;
  display: flex; flex-wrap: nowrap; align-items: center; gap: 0.5rem 1rem;
  border-radius: var(--radius-lg); border: 1px solid var(--border);
  background: var(--popover); color: var(--popover-foreground);
  padding: 0.5rem 0.5rem 0.5rem 1rem;
  box-shadow: var(--shadow-lg);
  font-size: 0.875rem; line-height: 1.25rem;
}
.rb-text { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 0.75rem; min-width: 0; }
.rb-msg { font-weight: 500; font-variant-numeric: tabular-nums; color: var(--foreground); }
.rb-status { color: var(--muted-foreground); }
.review-bar .btn-sm { height: 2rem; }
@media (max-width: 639px) {
  .bar-stack { left: 1rem; right: 1rem; width: auto; transform: none; align-items: stretch; }
  .review-bar { width: auto; flex-wrap: wrap; padding: 0.625rem 0.625rem 0.625rem 0.875rem; }
  .rb-text { flex-direction: column; gap: 0; }
}

.ann-list { display: grid; gap: 0.375rem; margin-top: 0.75rem; }
.ann-list li { display: flex; flex-wrap: wrap; align-items: center; gap: 0.375rem 0.5rem; font-size: 0.875rem; padding: 0.5rem 0.625rem; border-radius: var(--radius-md); border: 1px solid var(--border); background: color-mix(in oklab, var(--muted) 40%, transparent); }

#lightbox { border: none; border-radius: var(--radius-lg); padding: 0; max-width: min(96vw, 90rem); background: var(--background); box-shadow: var(--shadow-lg); }
#lightbox::backdrop { background: rgb(0 0 0 / 0.55); }
#lightbox img { display: block; max-width: 96vw; max-height: 90vh; border-radius: var(--radius-md); }
</style>
</head>
<body>
<header class="site-header">
  <div class="container hero-bar">
    <div class="stack" style="gap:0.25rem">
      <h1 id="title">Functional QA review</h1>
      <p class="text-sm muted" id="subtitle"></p>
    </div>
    <div class="end">
      <span class="badge badge-secondary" id="verdict">—</span>
      <span class="text-sm muted" id="score"></span>
    </div>
  </div>
</header>
<main class="page-main">
  <div class="container stack" id="cards"></div>
  <div class="container" style="margin-top:1.25rem">
    <section class="card">
      <div class="card-header">
        <h2 class="card-title" id="ann-title">Add a missed issue</h2>
        <p class="card-description" id="ann-help">Describe a product bug the run missed. It becomes a finding after Send.</p>
      </div>
      <div class="card-content stack">
        <div class="row">
          <label class="label">Severity
            <span class="native-select-wrap">
              <select class="native-select" id="ann-sev">
                <option value="BLOCKER">BLOCKER</option>
                <option value="WARNING">WARNING</option>
              </select>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </span>
          </label>
          <label class="label">Triage
            <span class="native-select-wrap">
              <select class="native-select" id="ann-triage">
                <option value="fix-now">Fix now</option>
                <option value="debt">Debt</option>
              </select>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </span>
          </label>
        </div>
        <label class="label" style="flex:1 1 100%">Note
          <textarea class="textarea" id="ann-note" placeholder="What is wrong?"></textarea>
        </label>
        <div class="row">
          <button type="button" class="btn btn-outline" id="ann-add">Add annotation</button>
        </div>
        <ul class="ann-list" id="ann-list"></ul>
      </div>
    </section>
  </div>
</main>
<div class="bar-stack" id="bar-stack">
  <div class="review-bar" id="review-bar" role="region" aria-label="Review and send">
    <div class="rb-text">
      <span class="rb-msg" id="review-bar-msg">Fix now 0 · Later 0</span>
      <span class="rb-status" id="review-bar-status" role="status">Not sent yet</span>
    </div>
    <button type="button" class="btn btn-default btn-sm" id="btn-send">Review and send</button>
  </div>
</div>
<dialog id="lightbox"><img alt="" /></dialog>
<script id="functional-qa-report" type="application/json">__REPORT_JSON__</script>
<script>
(() => {
  const report = JSON.parse(document.getElementById('functional-qa-report').textContent);
  const L = report.ui || {};
  const t = (k, fallback) => L[k] || fallback;
  document.getElementById('title').textContent = t('title', 'Functional QA review');
  document.getElementById('subtitle').textContent =
    `${report.meta.feature || ''} · ${report.meta.slug || ''} · ${report.meta.generatedAt || ''}`;
  const sc = report.scorecard || {};
  const verd = document.getElementById('verdict');
  const v = sc.verdict || '—';
  verd.textContent = v;
  verd.className = 'badge ' + (
    v === 'FAIL' ? 'badge-destructive' :
    v === 'REVIEW' ? 'badge-amber' :
    v === 'PASS' ? 'badge-emerald' : 'badge-secondary'
  );
  document.getElementById('score').textContent =
    t('score', 'open {open} · fix-now {fixNow} · debt {debt} · settled {settled}')
      .replace('{open}', sc.open ?? 0)
      .replace('{fixNow}', sc.fixNow ?? 0)
      .replace('{debt}', sc.debt ?? 0)
      .replace('{settled}', sc.settled ?? 0);

  const state = {
    triage: {},
    dismiss: {},
    annotations: [],
  };
  for (const f of report.findings || []) {
    if (f.severity === 'PASS') continue;
    if (f.resolution === 'DISMISSED' || f.resolution === 'INTENTIONAL') continue;
    state.triage[f.id] = f.triage === 'debt' ? 'debt' : 'fix-now';
  }

  const cards = document.getElementById('cards');
  const lightbox = document.getElementById('lightbox');
  const lightImg = lightbox.querySelector('img');
  const chev = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function sevBadge(sev) {
    if (sev === 'BLOCKER') return 'badge badge-destructive';
    if (sev === 'WARNING') return 'badge badge-amber';
    if (sev === 'PASS') return 'badge badge-emerald';
    return 'badge badge-secondary';
  }

  function selectWrap(name, inner) {
    return `<label class="label">${name}<span class="native-select-wrap">${inner}${chev}</span></label>`;
  }

  function render() {
    cards.innerHTML = '';
    for (const f of report.findings || []) {
      const closed = f.severity === 'PASS' || f.resolution === 'DISMISSED' || f.resolution === 'INTENTIONAL';
      const el = document.createElement('article');
      el.className = 'card';
      el.dataset.id = f.id;
      const hints = (f.sourceHints || []).map(h =>
        `<div class="hints"><code>${esc(h.path)}</code> — ${esc(h.reason)}</div>`
      ).join('');
      const shots = (f.evidence?.screenshots || []).map(s =>
        `<img src="${esc(s)}" alt="" data-full="${esc(s)}" />`
      ).join('');
      const allure = f.evidence?.allureUrl || report.meta.allureUrl;
      const badges = `
        <div class="row">
          <span class="${sevBadge(f.severity)}">${esc(f.severity)}</span>
          <span class="badge badge-outline">${esc(f.id)}</span>
          <span class="badge badge-secondary">${esc(f.classification)}</span>
          ${closed ? `<span class="badge badge-outline">${esc(f.resolution)}</span>` : ''}
        </div>`;
      const body = `
        <div class="kv"><b>${t('expected','Expected')}:</b> ${esc(f.expected)}</div>
        <div class="kv"><b>${t('actual','Actual')}:</b> ${esc(f.actual)}</div>
        ${f.spec ? `<div class="kv"><b>Spec:</b> ${esc(f.spec)}</div>` : ''}
        ${f.fix?.summary ? `<div class="kv"><b>${t('fix','Fix')}:</b> ${esc(f.fix.summary)}</div>` : ''}
        ${hints}
        ${allure ? `<div class="kv"><a href="${esc(allure)}" target="_blank" rel="noopener">${t('allure','Open Allure')}</a></div>` : ''}
        ${shots ? `<div class="shots">${shots}</div>` : ''}
        ${closed ? '' : `
        <div class="actions">
          <div class="row">
            ${selectWrap(t('triage','Triage'), `<select class="native-select" data-act="triage">
              <option value="fix-now">${t('fixNow','Fix now')}</option>
              <option value="debt">${t('debt','Debt')}</option>
            </select>`)}
            ${selectWrap(t('dismiss','Dismiss'), `<select class="native-select" data-act="dismiss-kind">
              <option value="">—</option>
              <option value="not-an-issue">${t('notIssue','Not an issue')}</option>
              <option value="remove">${t('remove','Out of scope')}</option>
              <option value="intentional">${t('intentional','Intentional')}</option>
            </select>`)}
          </div>
          <label class="label">${t('dismissReason','Dismiss reason (required if dismissing)')}
            <textarea class="textarea" data-act="dismiss-reason" placeholder="${esc(t('dismissReason','Dismiss reason (required if dismissing)'))}"></textarea>
          </label>
        </div>`}`;
      el.innerHTML = `
        <div class="card-header">
          ${badges}
          <h2 class="card-title">${esc(f.title)}</h2>
        </div>
        <div class="card-content">${body}</div>`;
      if (!closed) {
        const sel = el.querySelector('[data-act=triage]');
        sel.value = state.triage[f.id] || 'fix-now';
        sel.addEventListener('change', () => { state.triage[f.id] = sel.value; paintBar(); });
        const dk = el.querySelector('[data-act=dismiss-kind]');
        const dr = el.querySelector('[data-act=dismiss-reason]');
        if (state.dismiss[f.id]) {
          dk.value = state.dismiss[f.id].kind;
          dr.value = state.dismiss[f.id].reason;
        }
        const syncDismiss = () => {
          if (!dk.value) { delete state.dismiss[f.id]; paintBar(); return; }
          state.dismiss[f.id] = { kind: dk.value, reason: dr.value.trim() };
          paintBar();
        };
        dk.addEventListener('change', syncDismiss);
        dr.addEventListener('input', syncDismiss);
      }
      el.querySelectorAll('.shots img').forEach(img => {
        img.addEventListener('click', () => {
          lightImg.src = img.dataset.full;
          lightbox.showModal();
        });
      });
      cards.appendChild(el);
    }
  }

  lightbox.addEventListener('click', () => lightbox.close());

  document.getElementById('ann-title').textContent = t('annTitle', 'Add a missed issue');
  document.getElementById('ann-help').textContent = t('annHelp', 'Describe a product bug the run missed. It becomes a finding after Send.');
  document.getElementById('ann-add').textContent = t('annAdd', 'Add annotation');
  document.getElementById('btn-send').textContent = t('send', 'Review and send');

  let sent = false;
  document.body.classList.add('has-bar');

  function counts() {
    let fixNow = 0;
    let later = 0;
    for (const f of report.findings || []) {
      if (f.severity === 'PASS') continue;
      if (f.resolution === 'DISMISSED' || f.resolution === 'INTENTIONAL') continue;
      if (state.dismiss[f.id]?.kind) continue;
      if ((state.triage[f.id] || 'fix-now') === 'debt') later += 1;
      else fixNow += 1;
    }
    for (const a of state.annotations) {
      if (a.decision === 'debt' && a.severity !== 'BLOCKER') later += 1;
      else fixNow += 1;
    }
    return { fixNow, later };
  }

  function paintBar() {
    const c = counts();
    document.getElementById('review-bar-msg').textContent =
      t('barSummary', 'Fix now {fixNow} · Later {later}')
        .replace('{fixNow}', String(c.fixNow))
        .replace('{later}', String(c.later));
    document.getElementById('review-bar-status').textContent = sent
      ? t('sentStatus', 'Sent to your agent')
      : t('notSent', 'Not sent yet');
    const bar = document.getElementById('review-bar');
    document.body.style.setProperty('--bar-h', bar.offsetHeight + 'px');
  }

  const annList = document.getElementById('ann-list');
  function renderAnns() {
    annList.innerHTML = state.annotations.map((a, i) =>
      `<li><span class="${sevBadge(a.severity)}">${esc(a.severity)}</span> <span class="badge badge-outline">${esc(a.decision)}</span> <span>${esc(a.note)}</span> <button type="button" class="btn btn-ghost" data-i="${i}" aria-label="Remove">×</button></li>`
    ).join('');
    annList.querySelectorAll('button').forEach(b => {
      b.addEventListener('click', () => {
        state.annotations.splice(+b.dataset.i, 1);
        renderAnns();
        paintBar();
      });
    });
    paintBar();
  }
  document.getElementById('ann-add').addEventListener('click', () => {
    const note = document.getElementById('ann-note').value.trim();
    if (!note) {
      document.getElementById('review-bar-status').textContent = t('needNote', 'Annotation note required');
      return;
    }
    state.annotations.push({
      note,
      severity: document.getElementById('ann-sev').value,
      decision: document.getElementById('ann-triage').value,
    });
    document.getElementById('ann-note').value = '';
    renderAnns();
  });

  function buildDoc() {
    const fixNow = [];
    const debt = [];
    const dismissals = [];
    for (const f of report.findings || []) {
      if (f.severity === 'PASS') continue;
      if (f.resolution === 'DISMISSED' || f.resolution === 'INTENTIONAL') continue;
      if (state.dismiss[f.id]?.kind) {
        const reason = state.dismiss[f.id].reason;
        if (!reason) throw new Error(t('needDismissReason', 'Dismiss reason required for ') + f.id);
        dismissals.push({
          findingId: f.id,
          kind: state.dismiss[f.id].kind,
          reason,
        });
        continue;
      }
      if ((state.triage[f.id] || 'fix-now') === 'debt') debt.push(f.id);
      else fixNow.push(f.id);
    }
    return {
      kind: 'functional-qa-decisions',
      version: 1,
      slug: report.meta.slug,
      feature: report.meta.feature,
      reportGeneratedAt: report.meta.generatedAt,
      decidedBy: null,
      decidedAt: new Date().toISOString(),
      tickets: false,
      triage: { fixNow, debt },
      dismissals,
      ...(state.annotations.length ? { annotations: state.annotations } : {}),
    };
  }

  document.getElementById('btn-send').addEventListener('click', async () => {
    const btn = document.getElementById('btn-send');
    try {
      const doc = buildDoc();
      btn.disabled = true;
      const res = await fetch('/decisions', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(doc),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || res.statusText);
      sent = true;
      paintBar();
      btn.textContent = t('sentBtn', 'Sent');
    } catch (e) {
      btn.disabled = false;
      document.getElementById('review-bar-status').textContent = e.message || String(e);
    }
  });

  render();
  paintBar();
  window.addEventListener('resize', paintBar);
})();
</script>
</body>
</html>
